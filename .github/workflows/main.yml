name: Main Branch CI/CD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Backend Verify
        run: ./mvnw clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Frontend Check
        run: |
          cd frontend
          npm ci
          npm run type-check

  build-and-publish-images:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest, ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest, ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: build-and-publish-images
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Simulate Staging Deployment
        run: |
          echo "Deploying to Staging Environment..."
          echo "Image Version: ${{ github.sha }}"
          # In a real environment, you would use SSH to connect to a staging server
          # or trigger a deployment via a platform like ArgoCD / AWS ECS / Kubernetes.
          # Example:
          # ssh -i ${{ secrets.STAGING_SSH_KEY }} user@staging.sivamachineworks.com "docker compose pull && docker compose up -d"
          echo "Deployment to Staging Successful."
